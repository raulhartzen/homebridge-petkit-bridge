<svg xmlns="http://www.w3.org/2000/svg" width="840" height="130" viewBox="0 0 840 130">
  <rect width="840" height="130" rx="14" fill="#113C46"/>
  <!-- sliders (settings motif) -->
  <g stroke="#F4EDE0" stroke-width="3.5" stroke-linecap="round">
    <line x1="52" y1="45" x2="200" y2="45" opacity="0.55"/>
    <line x1="52" y1="67" x2="200" y2="67" opacity="0.55"/>
    <line x1="52" y1="89" x2="200" y2="89" opacity="0.55"/>
  </g>
  <circle cx="150" cy="45" r="7" fill="#F0B34C"/>
  <circle cx="92"  cy="67" r="7" fill="#F0B34C"/>
  <circle cx="176" cy="89" r="7" fill="#F0B34C"/>
  <!-- title -->
  <text x="248" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="30" font-weight="700" fill="#F4EDE0">PetKit Bridge</text>
  <text x="248" y="90" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14" fill="#8FB2B8" letter-spacing="2">PLUGIN CONFIGURATION</text>
  <!-- baseline -->
  <line x1="694" y1="96" x2="812" y2="96" stroke="#F4EDE0" stroke-width="3.5"
        stroke-linecap="round" opacity="0.55"/>
  <!-- cream cat (left), tail curling left -->
  <g transform="translate(730,96)" fill="#EDD9B5">
    <path d="M -9 -4 q -12 2.5 -10.5 -13.5" stroke="#EDD9B5" stroke-width="2.8"
          fill="none" stroke-linecap="round"/>
    <ellipse cx="0" cy="-11" rx="9" ry="11"/>
    <circle cx="0" cy="-26" r="7"/>
    <path d="M -6.2 -29 L -5.1 -37.5 L -1.1 -31.8 Z"/>
    <path d="M 6.2 -29 L 5.1 -37.5 L 1.1 -31.8 Z"/>
  </g>
  <!-- tuxedo cat (right): dark coat, white bib and muzzle -->
  <g transform="translate(768,96)">
    <path d="M 9 -4 q 12 2.5 10.5 -13.5" stroke="#0D1B1F" stroke-width="2.8"
          fill="none" stroke-linecap="round"/>
    <g fill="#0D1B1F" stroke="#F4EDE0" stroke-width="0.9">
      <ellipse cx="0" cy="-11" rx="9" ry="11"/>
      <circle cx="0" cy="-26" r="7"/>
      <path d="M -6.2 -29 L -5.1 -37.5 L -1.1 -31.8 Z"/>
      <path d="M 6.2 -29 L 5.1 -37.5 L 1.1 -31.8 Z"/>
    </g>
    <ellipse cx="0" cy="-8" rx="4.6" ry="7" fill="#F4EDE0"/>
    <circle cx="0" cy="-23" r="2.7" fill="#F4EDE0"/>
  </g>
</svg>
